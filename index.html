<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="description" content="Studio Dorian — objects that reward curiosity. Pelagia, an ongoing exploration of the marine and aquatic world.">
  <title>Studio Dorian</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --paper: #f4f1ea;
      --ink: #171717;
      --muted: #666057;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "Montserrat", Arial, sans-serif;
    }

    main {
      min-height: 100svh;
      display: grid;
      grid-template-columns: minmax(320px, 43%) 57%;
    }

    .content {
      min-height: 100svh;
      padding: clamp(42px, 7vw, 96px);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .monogram {
      width: 66px;
      height: 66px;
      object-fit: contain;
      margin-bottom: 38px;
      mix-blend-mode: multiply;
    }

    .studio {
      margin: 0 0 20px;
      font-size: 0.76rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 7.5ch;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(4.2rem, 7.2vw, 8rem);
      font-weight: 400;
      line-height: 0.86;
      letter-spacing: -0.035em;
    }

    .rule {
      width: 62px;
      height: 1px;
      margin: 44px 0 34px;
      background: var(--ink);
    }

    .pelagia {
      margin: 0 0 12px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2rem, 3vw, 3.1rem);
      font-style: italic;
      font-weight: 400;
    }

    .description {
      max-width: 470px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(0.98rem, 1.15vw, 1.12rem);
      font-weight: 300;
      line-height: 1.75;
    }

    .contact {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 28px;
      margin-top: 54px;
      font-size: 0.82rem;
      letter-spacing: 0.03em;
    }

    .contact a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 4px;
    }

    .contact a:hover,
    .contact a:focus-visible {
      border-color: currentColor;
    }

    .image {
      min-height: 100svh;
      overflow: hidden;
      background: #ebe7df;
    }

    .image img {
      width: 100%;
      height: 100svh;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    @media (max-width: 820px) {
      main {
        display: flex;
        flex-direction: column;
      }

      .content {
        min-height: auto;
        padding: 76px 28px 62px;
      }

      .image {
        min-height: 58svh;
      }

      .image img {
        height: 58svh;
      }

      .contact {
        flex-direction: column;
        gap: 14px;
      }
    }

    @media (max-width: 480px) {
      .content {
        padding-left: 22px;
        padding-right: 22px;
      }

      h1 {
        font-size: clamp(4rem, 18vw, 5.8rem);
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="content">
      <img class="monogram" src="dh-monogram.png" alt="DH monogram">

      <p class="studio">Studio Dorian</p>

      <h1>Objects that reward curiosity.</h1>

      <div class="rule"></div>

      <h2 class="pelagia">Pelagia</h2>

      <p class="description">
        An ongoing exploration of the marine and aquatic world,
        created for a modern cabinet of curiosities.
      </p>

      <div class="contact">
        <a href="mailto:hello@studiodorian.co.uk">hello@studiodorian.co.uk</a>
        <a href="https://www.instagram.com/studiodorian.co.uk/" target="_blank" rel="noopener noreferrer">@studiodorian.co.uk</a>
      </div>
    </section>

    <section class="image">
      <img src="cover.jpg" alt="Studio Dorian Pelagia plate">
    </section>
  </main>
</body>
</html>
